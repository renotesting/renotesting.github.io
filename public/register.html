<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - RenoFitness</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .register-container {
      background: white;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 450px;
      padding: 40px;
    }

    .register-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .register-header h1 {
      color: #333;
      font-size: 28px;
      margin-bottom: 10px;
    }

    .register-header p {
      color: #666;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      color: #333;
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 5px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #667eea;
    }

    .password-requirements {
      font-size: 12px;
      color: #666;
      margin-top: 5px;
    }

    .requirement {
      margin: 3px 0;
    }

    .requirement.met {
      color: #28a745;
    }

    .register-button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-bottom: 15px;
    }

    .register-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .register-button:active {
      transform: translateY(0);
    }

    .form-footer {
      text-align: center;
      margin-top: 20px;
    }

    .form-footer p {
      color: #666;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .form-footer a {
      color: #667eea;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.3s;
    }

    .form-footer a:hover {
      color: #764ba2;
    }

    .error-message {
      background-color: #f8d7da;
      color: #721c24;
      padding: 12px;
      border-radius: 5px;
      margin-bottom: 20px;
      display: none;
      border: 1px solid #f5c6cb;
    }

    .success-message {
      background-color: #d4edda;
      color: #155724;
      padding: 12px;
      border-radius: 5px;
      margin-bottom: 20px;
      display: none;
      border: 1px solid #c3e6cb;
    }

    .loading {
      display: none;
      text-align: center;
      color: #667eea;
      font-size: 14px;
    }

    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="register-container">
    <div class="register-header">
      <h1>🏋️ RenoFitness</h1>
      <p>Create Your Account</p>
    </div>

    <div id="errorMessage" class="error-message"></div>
    <div id="successMessage" class="success-message"></div>

    <form id="registerForm">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required placeholder="John Doe">
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required placeholder="your@email.com">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="••••••••">
        <div class="password-requirements">
          <div class="requirement" id="req-length">✗ At least 6 characters</div>
          <div class="requirement" id="req-uppercase">✗ At least one uppercase letter</div>
          <div class="requirement" id="req-number">✗ At least one number</div>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="••••••••">
      </div>

      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Creating account...</p>
      </div>

      <button type="submit" class="register-button" id="submitBtn">Create Account</button>
    </form>

    <div class="form-footer">
      <p>Already have an account? <a href="login.html">Login here</a></p>
      <p><a href="index.html">← Back to Home</a></p>
    </div>
  </div>

  <script>
    const registerForm = document.getElementById('registerForm');
    const errorMessage = document.getElementById('errorMessage');
    const successMessage = document.getElementById('successMessage');
    const passwordInput = document.getElementById('password');
    const loading = document.getElementById('loading');
    const submitBtn = document.getElementById('submitBtn');

    // Password validation while typing
    passwordInput.addEventListener('input', () => {
      const password = passwordInput.value;
      const reqLength = document.getElementById('req-length');
      const reqUppercase = document.getElementById('req-uppercase');
      const reqNumber = document.getElementById('req-number');

      // Check length
      if (password.length >= 6) {
        reqLength.classList.add('met');
        reqLength.textContent = '✓ At least 6 characters';
      } else {
        reqLength.classList.remove('met');
        reqLength.textContent = '✗ At least 6 characters';
      }

      // Check uppercase
      if (/[A-Z]/.test(password)) {
        reqUppercase.classList.add('met');
        reqUppercase.textContent = '✓ At least one uppercase letter';
      } else {
        reqUppercase.classList.remove('met');
        reqUppercase.textContent = '✗ At least one uppercase letter';
      }

      // Check number
      if (/[0-9]/.test(password)) {
        reqNumber.classList.add('met');
        reqNumber.textContent = '✓ At least one number';
      } else {
        reqNumber.classList.remove('met');
        reqNumber.textContent = '✗ At least one number';
      }
    });

    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      // Clear messages
      errorMessage.style.display = 'none';
      successMessage.style.display = 'none';

      // Validation
      if (!name || !email || !password || !confirmPassword) {
        errorMessage.textContent = '❌ Please fill in all fields';
        errorMessage.style.display = 'block';
        return;
      }

      if (password !== confirmPassword) {
        errorMessage.textContent = '❌ Passwords do not match';
        errorMessage.style.display = 'block';
        return;
      }

      if (password.length < 6) {
        errorMessage.textContent = '❌ Password must be at least 6 characters';
        errorMessage.style.display = 'block';
        return;
      }

      // Show loading
      loading.style.display = 'block';
      submitBtn.disabled = true;

      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ name, email, password, confirmPassword })
        });

        const data = await response.json();

        if (response.ok) {
          // Save token to localStorage
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));

          successMessage.textContent = '✅ ' + data.message + ' Redirecting to login...';
          successMessage.style.display = 'block';

          // Redirect after 2 seconds
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 2000);
        } else {
          errorMessage.textContent = '❌ ' + (data.error || 'Registration failed');
          errorMessage.style.display = 'block';
        }
      } catch (error) {
        errorMessage.textContent = '❌ Error: ' + error.message;
        errorMessage.style.display = 'block';
      } finally {
        loading.style.display = 'none';
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
